apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wazuh

resources:
- ../eks
- ingress.yaml
- service-account.yaml
patches:
- path: arch.yaml
- path: dashboard-cred-secret.yaml

configMapGenerator:
  - name: wazuh-conf
    behavior: replace
    namespace: wazuh
    files:
      - wazuh_conf/master.conf
      - wazuh_conf/worker.conf
  - name: wazuh-filebeat
    namespace: wazuh
    files:
     - wazuh_conf/filebeat.yml
  - name: wazuh-local-internal-options
    namespace: wazuh
    files:
     - wazuh_conf/local_internal_options.conf
  - name: wazuh-ecr-rules
    namespace: wazuh
    files:
     - wazuh_conf/ecr_rules.xml

