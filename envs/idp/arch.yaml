---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  template:
    spec:
      serviceAccountName: wazuh
      nodeSelector:
        kubernetes.io/arch: amd64

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  template:
    spec:
      serviceAccountName: wazuh
      nodeSelector:
        kubernetes.io/arch: amd64

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-master
  namespace: wazuh
spec:
  template:
    spec:
      serviceAccountName: wazuh
      nodeSelector:
        kubernetes.io/arch: amd64

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
  namespace: wazuh
spec:
  template:
    spec:
      serviceAccountName: wazuh
      nodeSelector:
        kubernetes.io/arch: amd64
